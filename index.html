<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Buscador SKUs — Aseguramiento de Calidad</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(180deg, #f8fafc 0%, #e0e7ff 100%);
  min-height: 100vh;
  color: #0f172a;
  padding: 12px;
  -webkit-font-smoothing: antialiased;
}

.container { max-width: 800px; margin: 0 auto; }

/* ═══ Header ═══ */
.header {
  background: linear-gradient(135deg, #166534 0%, #15803d 100%);
  color: white;
  padding: 18px 20px;
  border-radius: 16px;
  margin-bottom: 14px;
  box-shadow: 0 8px 24px rgba(22,101,52,0.25);
}

.header h1 {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}

.header .meta {
  font-size: 12px;
  opacity: 0.9;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}

.header .meta strong { font-family: 'SF Mono', Monaco, monospace; }

/* ═══ Tabs ═══ */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  background: white;
  padding: 5px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.tab {
  flex: 1;
  padding: 11px 8px;
  background: transparent;
  border: none;
  font-size: 13px;
  font-weight: 600;
  color: #64748b;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.tab:active { transform: scale(0.97); }
.tab.active {
  background: linear-gradient(135deg, #166534 0%, #15803d 100%);
  color: white;
  box-shadow: 0 4px 10px rgba(22,101,52,0.3);
}

/* ═══ Search Box ═══ */
.search-wrapper {
  background: white;
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  margin-bottom: 12px;
}

.search-box {
  position: relative;
  margin-bottom: 10px;
}

.search-box input {
  width: 100%;
  padding: 16px 16px 16px 50px;
  font-size: 17px;
  font-weight: 600;
  border: 2.5px solid #166534;
  border-radius: 14px;
  background: #f0fdf4;
  color: #166534;
  font-family: inherit;
  -webkit-appearance: none;
}

.search-box input:focus {
  outline: none;
  background: white;
  box-shadow: 0 0 0 5px rgba(22,101,52,0.15);
}

.search-box::before {
  content: '🔍';
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
}

.search-box .clear-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: #e5e7eb;
  border: none;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  font-size: 14px;
  cursor: pointer;
  color: #64748b;
  display: none;
  font-weight: bold;
}

.search-box .clear-btn.show { display: block; }
.search-box .clear-btn:active { background: #d1d5db; }

.helper-text {
  font-size: 12px;
  color: #64748b;
  padding: 4px 6px;
}

.helper-text strong { color: #166534; }

/* ═══ Lote Input ═══ */
.lote-section {
  background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
  border: 2px solid #f59e0b;
  border-radius: 12px;
  padding: 12px 14px;
  margin-top: 8px;
}

.lote-section label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #92400e;
  display: block;
  margin-bottom: 6px;
}

.lote-section input {
  width: 100%;
  padding: 10px 14px;
  font-size: 16px;
  font-weight: 700;
  border: 2px solid #f97316;
  border-radius: 8px;
  background: white;
  color: #ea580c;
  font-family: 'SF Mono', Monaco, monospace;
  letter-spacing: 2px;
  text-align: center;
  -webkit-appearance: none;
}

.lote-section input:focus {
  outline: none;
  box-shadow: 0 0 0 4px rgba(249,115,22,0.2);
}

.lote-section .lote-tip {
  font-size: 11px;
  color: #92400e;
  margin-top: 5px;
  text-align: center;
}

.lote-quick {
  display: inline-block;
  background: #fbbf24;
  color: #78350f;
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  margin-left: 4px;
  cursor: pointer;
  border: none;
  font-family: inherit;
}

.lote-quick:active { background: #f59e0b; }

/* ═══ Results List ═══ */
.results-info {
  padding: 10px 14px;
  background: #eff6ff;
  border-radius: 10px;
  margin-bottom: 10px;
  font-size: 13px;
  font-weight: 600;
  color: #1e3a8a;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sku-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sku-card {
  background: white;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  border-left: 4px solid #cbd5e1;
  transition: all 0.2s;
  cursor: pointer;
}

.sku-card:active { transform: scale(0.99); }
.sku-card.expanded { border-left-color: #166534; box-shadow: 0 6px 20px rgba(22,101,52,0.15); }

.sku-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.sku-card-left { flex: 1; min-width: 0; }

.sku-code {
  font-family: 'SF Mono', Monaco, monospace;
  font-size: 13px;
  font-weight: 700;
  color: #ea580c;
  background: #fffbeb;
  padding: 2px 8px;
  border-radius: 6px;
  display: inline-block;
  margin-bottom: 5px;
}

.sku-desc {
  font-size: 14px;
  font-weight: 600;
  color: #0f172a;
  line-height: 1.3;
  margin-bottom: 6px;
}

.sku-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.sku-tag {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 10px;
  background: #f1f5f9;
  color: #475569;
}

.sku-tag.familia { background: #f5f3ff; color: #6d28d9; }
.sku-tag.marca { background: #dbeafe; color: #1e40af; }
.sku-tag.presentacion { background: #e0e7ff; color: #4338ca; font-weight: 700; }

.sku-card-right {
  text-align: right;
  flex-shrink: 0;
}

.vence-mini {
  font-size: 11px;
  color: #64748b;
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 0.3px;
}

.vence-date {
  font-size: 13px;
  font-weight: 700;
  color: #1e3a8a;
  margin-top: 2px;
}

.dias-badge {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  margin-top: 4px;
}

.dias-badge.urgent { background: #fee2e2; color: #b91c1c; }
.dias-badge.warning { background: #fef3c7; color: #92400e; }
.dias-badge.ok { background: #dcfce7; color: #166534; }

/* ═══ Expanded Detail ═══ */
.sku-detail {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 2px dashed #e2e8f0;
}

.sku-card.expanded .sku-detail { display: block; }

.detail-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}

.detail-card {
  background: #f8fafc;
  padding: 9px 11px;
  border-radius: 8px;
  border-left: 3px solid #cbd5e1;
}

.detail-card.hoy { background: #fce7f3; border-left-color: #ec4899; }
.detail-card.lote { background: #fffbeb; border-left-color: #f97316; }
.detail-card.vida { background: #dbeafe; border-left-color: #2563eb; }
.detail-card.vence { background: #f0fdf4; border-left-color: #22c55e; }

.detail-label {
  font-size: 10px;
  text-transform: uppercase;
  font-weight: 600;
  color: #64748b;
  letter-spacing: 0.4px;
  margin-bottom: 2px;
}

.detail-value {
  font-size: 14px;
  font-weight: 700;
  color: #0f172a;
}

.detail-value.lote-val { font-family: 'SF Mono', Monaco, monospace; color: #be185d; }
.detail-value.fecha { color: #1e3a8a; }
.detail-value.urgent { color: #b91c1c; }
.detail-value.warning { color: #92400e; }
.detail-value.ok { color: #166534; }

.rebanado-section {
  background: #f5f3ff;
  border-radius: 10px;
  padding: 10px 12px;
  margin-top: 10px;
}

.rebanado-section .reb-title {
  font-size: 11px;
  font-weight: 700;
  color: #6d28d9;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 8px;
}

.rebanado-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 6px;
}

.reb-item {
  background: white;
  padding: 6px 9px;
  border-radius: 6px;
  border: 1px solid #c7d2fe;
}

.reb-item-label {
  font-size: 9px;
  color: #6d28d9;
  text-transform: uppercase;
  font-weight: 600;
}

.reb-item-value {
  font-size: 12px;
  font-weight: 700;
  color: #4338ca;
  margin-top: 1px;
}

/* ═══ Categoría Filters ═══ */
.filters-panel {
  background: white;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
}

.filter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.filter-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.filter-item.full { grid-column: 1 / -1; }

.filter-item label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #4338ca;
}

.filter-item select,
.filter-item input {
  padding: 10px 12px;
  border: 1.5px solid #c7d2fe;
  border-radius: 8px;
  font-size: 14px;
  background: white;
  color: #1e293b;
  font-family: inherit;
  -webkit-appearance: none;
}

.filter-item select:focus,
.filter-item input:focus {
  outline: none;
  border-color: #4338ca;
  box-shadow: 0 0 0 3px rgba(67,56,202,0.15);
}

.btn-reset {
  background: #fef2f2;
  color: #991b1b;
  border: 1.5px solid #fecaca;
  padding: 9px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
  font-family: inherit;
}

.btn-reset:active { background: #fee2e2; }

/* ═══ Empty ═══ */
.empty-state {
  text-align: center;
  padding: 50px 20px;
  background: white;
  border-radius: 14px;
  color: #94a3b8;
}

.empty-state .emoji { font-size: 56px; margin-bottom: 10px; opacity: 0.7; }
.empty-state h3 { font-size: 17px; color: #475569; margin-bottom: 4px; font-weight: 600; }
.empty-state p { font-size: 13px; }

/* ═══ Panel ═══ */
.panel { display: none; }
.panel.active { display: block; }

/* iPhone safe areas */
@supports (padding: max(0px)) {
  body { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
}

.barcode-box {
  margin-top: 12px; padding: 14px;
  background: #0f172a; border-radius: 12px;
  border: 2px solid #06b6d4; text-align: center;
  box-shadow: 0 0 16px rgba(6,182,212,0.25);
}
.barcode-label {
  font-size: 11px; font-weight: 700; color: #06b6d4;
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px;
}
.barcode-value {
  font-family: 'Courier New', monospace;
  font-size: 22px; font-weight: 800; letter-spacing: 4px; color: #fff;
  padding: 10px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,0.85) 0 2px, transparent 2px 5px);
  border-radius: 6px; display: inline-block;
  text-shadow: 0 0 2px #000, 0 0 4px #000;
}

</style>
</head>

// ── Utils ────────────────────────────────────
function pad2(n){ return n.toString().padStart(2,'0'); }

function todayLote(){
  const d = new Date();
  return pad2(d.getFullYear()-2000) + pad2(d.getMonth()+1) + pad2(d.getDate());
}

function loteToDate(lote){
  if (!lote || lote.length !== 6 || !/^\d{6}$/.test(lote)) return null;
  const yy = parseInt(lote.substring(0,2), 10);
  const mm = parseInt(lote.substring(2,4), 10);
  const dd = parseInt(lote.substring(4,6), 10);
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
  const d = new Date(2000+yy, mm-1, dd);
  if (d.getFullYear() !== 2000+yy || d.getMonth() !== mm-1 || d.getDate() !== dd) return null;
  return d;
}

function fmtDate(d){
  if (!d || !(d instanceof Date) || isNaN(d)) return '—';
  return pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + '/' + d.getFullYear();
}

function diasEntre(fecha){
  const today = new Date();
  today.setHours(0,0,0,0);
  const t = new Date(fecha);
  t.setHours(0,0,0,0);
  return Math.round((t - today) / 86400000);
}

function alertClass(d){
  if (d === null || d === undefined) return '';
  if (d <= 7) return 'urgent';
  if (d <= 20) return 'warning';
  return 'ok';
}

function alertLabel(d){
  if (d <= 0) return '🔴 VENCIDO';
  if (d <= 7) return '🔴 URGENTE';
  if (d <= 20) return '🟡 PRÓXIMO';
  return '🟢 OK';
}

// ── Header ────────────────────────────────────
function updateHeader(){
  document.getElementById('today-date').textContent = fmtDate(new Date());
  document.getElementById('today-lote').textContent = todayLote();
}

// ── Tabs ──────────────────────────────────────
function switchTab(name, btn){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

// ── Card Rendering ────────────────────────────
function renderCard(sku, lote){
  const reb = REBANADO[sku.sku];
  const today = new Date();
  const venceHoy = new Date(today.getTime() + sku.vida_util * 86400000);

  // Lote info
  let loteInfo = '';
  if (lote && /^\d{6}$/.test(lote)) {
    const fechaLote = loteToDate(lote);
    if (fechaLote) {
      const venceLote = new Date(fechaLote.getTime() + sku.vida_util * 86400000);
      const dias = diasEntre(venceLote);
      const ac = alertClass(dias);
      loteInfo = `
        <div class="detail-card lote">
          <div class="detail-label">🏷️ Lote</div>
          <div class="detail-value lote-val">${lote}</div>
        </div>
        <div class="detail-card lote">
          <div class="detail-label">Fecha entrada</div>
          <div class="detail-value fecha">${fmtDate(fechaLote)}</div>
        </div>
        <div class="detail-card vence">
          <div class="detail-label">Fecha vence</div>
          <div class="detail-value fecha">${fmtDate(venceLote)}</div>
        </div>
        <div class="detail-card vence">
          <div class="detail-label">Días restantes</div>
          <div class="detail-value ${ac}">${dias}d ${alertLabel(dias).substring(0,2)}</div>
        </div>
      `;
    } else {
      loteInfo = `<div class="detail-card" style="background:#fef2f2; border-left-color:#ef4444;">
        <div class="detail-label">⚠️ Lote inválido</div>
        <div class="detail-value" style="color:#991b1b; font-size:11px;">Usa formato AAMMDD</div>
      </div>`;
    }
  }

  // Rebanado
  let rebHtml = '';
  if (reb) {
    const fields = [
      ['Familia', reb.familia],
      ['Rebanadas/paq', reb.rebanadas],
      ['Diámetro', reb.diametro],
      ['Peso paq', reb.peso_paq],
      ['Peso mín', reb.peso_min],
      ['Peso máx', reb.peso_max],
      ['Peso 10reb', reb.peso_10reb],
      ['Grosor', reb.grosor],
      ['RPM', reb.rpm],
    ].filter(([_,v]) => v && v !== 'None' && v !== 'nan');

    if (fields.length) {
      rebHtml = `
        <div class="rebanado-section">
          <div class="reb-title">🟣 Rebanado</div>
          <div class="rebanado-grid">
            ${fields.map(([l,v]) => `
              <div class="reb-item">
                <div class="reb-item-label">${l}</div>
                <div class="reb-item-value">${v}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }
  }

  // Top right: show "vence hoy" if no lote, else show lote's vencimiento
  let topRight = '';
  if (lote && /^\d{6}$/.test(lote) && loteToDate(lote)) {
    const fechaLote = loteToDate(lote);
    const venceLote = new Date(fechaLote.getTime() + sku.vida_util * 86400000);
    const dias = diasEntre(venceLote);
    const ac = alertClass(dias);
    topRight = `
      <div class="vence-mini">Vence (lote ${lote})</div>
      <div class="vence-date">${fmtDate(venceLote)}</div>
      <span class="dias-badge ${ac}">${dias}d</span>
    `;
  } else {
    topRight = `
      <div class="vence-mini">Vence HOY+</div>
      <div class="vence-date">${fmtDate(venceHoy)}</div>
      <span class="dias-badge ok">${sku.vida_util}d</span>
    `;
  }

  return `
    <div class="sku-card" onclick="this.classList.toggle('expanded')">
      <div class="sku-card-header">
        <div class="sku-card-left">
          <div class="sku-code">${sku.sku}</div>
          <div class="sku-desc">${sku.descripcion}</div>
          <div class="sku-tags">
            ${sku.familia ? `<span class="sku-tag familia">${sku.familia}</span>` : ''}
            ${sku.marca ? `<span class="sku-tag marca">${sku.marca}</span>` : ''}
            ${sku.presentacion ? `<span class="sku-tag presentacion">📦 ${sku.presentacion}</span>` : ''}
            ${sku.categoria ? `<span class="sku-tag">${sku.categoria}</span>` : ''}
          </div>
        </div>
        <div class="sku-card-right">${topRight}</div>
      </div>

      <div class="sku-detail">
        <div class="detail-row">
          <div class="detail-card vida">
            <div class="detail-label">Vida útil</div>
            <div class="detail-value">${sku.vida_util} días</div>
          </div>
          <div class="detail-card hoy">
            <div class="detail-label">Lote HOY</div>
            <div class="detail-value lote-val" style="color:#be185d;">${todayLote()}</div>
          </div>
          <div class="detail-card hoy">
            <div class="detail-label">Vence HOY+</div>
            <div class="detail-value fecha" style="color:#be185d;">${fmtDate(venceHoy)}</div>
          </div>
          ${loteInfo}
        </div>
        ${sku.codigo_barras ? `
        <div class="barcode-box">
          <div class="barcode-label">📊 Código de barras (verificar)</div>
          <div class="barcode-value">${sku.codigo_barras}</div>
        </div>` : ''}
        ${rebHtml}
      </div>
    </div>
  `;
}

// ── Búsqueda Rápida ───────────────────────────
function renderSkuList(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const lote = document.getElementById('lote-input').value.trim();
  document.getElementById('clear-search').classList.toggle('show', !!q);

  let results = SKUS;
  if (q) {
    results = SKUS.filter(s => {
      const hay = `${s.sku} ${s.descripcion} ${s.marca} ${s.familia} ${s.categoria} ${s.presentacion} ${s.codigo_barras||""}`.toLowerCase();
      return hay.includes(q);
    });
  }

  // Limit to first 50 to keep it fast
  const shown = results.slice(0, 50);

  document.getElementById('search-info').innerHTML =
    `📊 ${results.length === SKUS.length ? `Mostrando los <strong>${SKUS.length}</strong> SKUs` :
       `<strong>${results.length}</strong> resultados` + (results.length > 50 ? ` (mostrando primeros 50)` : '')}` +
    (q ? ` para "<strong>${q}</strong>"` : '') +
    (lote && /^\d{6}$/.test(lote) ? ` · 🏷️ Lote: <strong>${lote}</strong>` : '');

  const list = document.getElementById('sku-list');
  if (!shown.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🔍</div>
        <h3>Sin resultados</h3>
        <p>No se encontraron SKUs con "${q}"</p>
      </div>
    `;
    return;
  }
  list.innerHTML = shown.map(s => renderCard(s, lote)).join('');
}

function clearSearch(){
  document.getElementById('search-input').value = '';
  renderSkuList();
  document.getElementById('search-input').focus();
}

function useTodayLote(){
  document.getElementById('lote-input').value = todayLote();
  renderSkuList();
}

document.getElementById('search-input').addEventListener('input', renderSkuList);
document.getElementById('lote-input').addEventListener('input', renderSkuList);

// ── Categoría ─────────────────────────────────
function renderCatList(){
  const fFam = document.getElementById('f-familia').value;
  const fCat = document.getElementById('f-categoria').value;
  const fMar = document.getElementById('f-marca').value;
  const fPres = document.getElementById('f-presentacion').value;
  const fText = document.getElementById('f-text').value.trim().toLowerCase();
  const lote = document.getElementById('lote-cat-input').value.trim();

  const results = SKUS.filter(s => {
    if (fFam && s.familia !== fFam) return false;
    if (fCat && s.categoria !== fCat) return false;
    if (fMar && s.marca !== fMar) return false;
    if (fPres && s.presentacion !== fPres) return false;
    if (fText) {
      const hay = `${s.sku} ${s.descripcion} ${s.marca} ${s.familia} ${s.categoria} ${s.presentacion} ${s.codigo_barras||""}`.toLowerCase();
      if (!hay.includes(fText)) return false;
    }
    return true;
  });

  // Limit to 100 for performance
  const shown = results.slice(0, 100);

  document.getElementById('cat-info').innerHTML =
    `📊 <strong>${results.length}</strong> de ${SKUS.length} SKUs` +
    (results.length > 100 ? ` (mostrando primeros 100)` : '') +
    (lote && /^\d{6}$/.test(lote) ? ` · 🏷️ <strong>${lote}</strong>` : '');

  const list = document.getElementById('cat-list');
  if (!shown.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🗂️</div>
        <h3>Sin resultados</h3>
        <p>Ajusta los filtros para ver SKUs</p>
      </div>
    `;
    return;
  }
  list.innerHTML = shown.map(s => renderCard(s, lote)).join('');
}

function resetFilters(){
  document.getElementById('f-familia').value = '';
  document.getElementById('f-categoria').value = '';
  document.getElementById('f-marca').value = '';
  document.getElementById('f-presentacion').value = '';
  document.getElementById('f-text').value = '';
  renderCatList();
}

function useTodayLoteCat(){
  document.getElementById('lote-cat-input').value = todayLote();
  renderCatList();
}

['f-familia','f-categoria','f-marca','f-presentacion'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderCatList);
});
document.getElementById('f-text').addEventListener('input', renderCatList);
document.getElementById('lote-cat-input').addEventListener('input', renderCatList);

// ── Init ──────────────────────────────────────
updateHeader();
setInterval(updateHeader, 60000);
renderSkuList();
renderCatList();
</script>
